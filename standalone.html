<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StadiumOS — Live Command Center</title>
    <script crossorigin src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@11.15.0/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/recharts@2.12.0/dist/Recharts.js"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #05060b;
            color: #fff;
        }

        .glass {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function ParticleBackground() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = Array.from({ length: 40 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    r: Math.random() * 0.5 + 0.2,
                    a: Math.random() * 0.5 + 0.1,
                }));

                function draw() {
                    ctx.fillStyle = 'rgba(5, 6, 11, 0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    particles.forEach((p) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;

                        ctx.fillStyle = `rgba(34, 211, 238, ${p.a})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    requestAnimationFrame(draw);
                }

                draw();

                function handleResize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 -z-10 opacity-60" />;
        }

        function Hero({ energy, agentsActive }) {
            return (
                <header className="relative overflow-hidden rounded-2xl p-6 bg-gradient-to-br from-[#071026] via-[#071428]/60 to-[#0b0520] shadow-2xl glass">
                    <div className="flex items-center justify-between gap-6">
                        <div>
                            <h1 className="text-4xl md:text-5xl font-semibold text-white tracking-tight">StadiumOS — Live Command Center</h1>
                            <p className="text-sm text-slate-300 mt-1">Multi-agent OS for immersive live events</p>

                            <div className="mt-4 flex items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-rose-500 animate-pulse inline-block" />
                                    <span className="text-sm text-rose-200">LIVE</span>
                                </div>
                                <div className="px-3 py-1 bg-white/5 rounded-full text-sm text-white/90">AI Agents Active: <span className="font-medium ml-2 text-cyan-300">{agentsActive}</span></div>
                                <div className="px-3 py-1 bg-white/3 rounded-full text-sm text-white/90">Crowd Energy: <span className="font-semibold ml-2 text-amber-300">{Math.round(energy)}%</span></div>
                            </div>
                        </div>

                        <div className="hidden md:flex flex-col items-end">
                            <div className="px-4 py-2 bg-gradient-to-r from-cyan-700/30 to-blue-900/30 rounded-lg glass border border-white/5 text-sm text-cyan-200">Next: Derby — 20:30 UTC</div>
                            <div className="mt-3 px-4 py-2 bg-white/3 rounded-lg text-xs text-white/60">Latency: <strong className="text-white">42ms</strong></div>
                        </div>
                    </div>
                </header>
            );
        }

        function AgentCard({ name, subtitle, activity, color = 'cyan' }) {
            const colorMap = {
                cyan: 'from-cyan-500 to-blue-600',
                purple: 'from-purple-500 to-pink-500',
                amber: 'from-amber-400 to-amber-600',
                green: 'from-emerald-400 to-green-500',
            };

            return (
                <div className="relative p-4 rounded-xl bg-white/3 backdrop-blur border border-white/5">
                    <div className="w-full flex items-start justify-between gap-3">
                        <div>
                            <div className={`inline-flex items-center gap-3 px-3 py-1 rounded-full bg-gradient-to-r ${colorMap[color]} text-white font-medium shadow-sm`}>{name}</div>
                            <div className="text-sm text-slate-300 mt-2">{subtitle}</div>
                        </div>
                        <div className="text-right">
                            <div className="text-xs text-slate-400">Activity</div>
                            <div className="mt-1 text-sm font-semibold text-white">{activity}</div>
                        </div>
                    </div>

                    <div className="mt-3 h-2 bg-white/6 rounded-full overflow-hidden">
                        <div
                            className={`h-2 rounded-full bg-gradient-to-r ${colorMap[color]}`}
                            style={{ width: `${20 + Math.min(80, activity.length * 3)}%` }}
                        />
                    </div>
                </div>
            );
        }

        function AgentPanel({ agents }) {
            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {agents.map((a) => (
                        <AgentCard key={a.id} name={a.name} subtitle={a.subtitle} activity={a.activity} color={a.color} />
                    ))}
                </div>
            );
        }

        function Feed({ items }) {
            return (
                <aside className="h-56 overflow-hidden rounded-xl bg-white/3 border border-white/5 p-3">
                    <ul className="space-y-2">
                        {items.slice(0, 12).map((it) => (
                            <li key={it.id} className="flex items-start gap-3 animate-slide-in">
                                <div className="w-9 h-9 rounded-full flex items-center justify-center bg-gradient-to-br from-violet-700 to-pink-500 text-white text-sm font-semibold">{it.tag}</div>
                                <div className="flex-1 text-left">
                                    <div className="text-sm text-white/90">{it.title}</div>
                                    <div className="text-xs text-slate-400">{it.time}</div>
                                </div>
                                <div className="text-xs text-amber-300 font-semibold">{it.impact}</div>
                            </li>
                        ))}
                    </ul>
                </aside>
            );
        }

        function EnergyViz({ energy }) {
            const radius = 72;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (energy / 100) * circumference;

            return (
                <div className="rounded-xl bg-white/3 border border-white/5 p-4 flex items-center gap-4">
                    <svg width="180" height="180" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="g1" x1="0" x2="1">
                                <stop offset="0%" stopColor="#06b6d4" />
                                <stop offset="100%" stopColor="#7c3aed" />
                            </linearGradient>
                        </defs>
                        <g transform="translate(100,100)">
                            <circle r={radius} fill="rgba(255,255,255,0.03)" />
                            <circle
                                r={radius}
                                fill="transparent"
                                stroke="url(#g1)"
                                strokeWidth="12"
                                strokeLinecap="round"
                                strokeDasharray={circumference}
                                strokeDashoffset={offset}
                                style={{ transform: 'rotate(-90deg)' }}
                            />
                            <text x="0" y="6" textAnchor="middle" fontSize="22" fill="#fff">{Math.round(energy)}%</text>
                        </g>
                    </svg>

                    <div>
                        <h4 className="text-white font-semibold">Crowd Energy</h4>
                        <p className="text-sm text-slate-300">Real-time momentum & emotion tracker</p>
                    </div>
                </div>
            );
        }

        function MomentumChart({ data }) {
            return (
                <div className="rounded-xl bg-white/3 border border-white/5 p-4">
                    <h3 className="text-white font-semibold mb-4">Momentum Timeline</h3>
                    <svg width="100%" height="200" style={{ minHeight: '200px' }} viewBox="0 0 500 200">
                        <polyline
                            fill="none"
                            stroke="#22d3ee"
                            strokeWidth="2"
                            points={data.map((d, i) => `${(i / Math.max(1, data.length - 1)) * 500},${200 - (d.energy / 100) * 180}`).join(' ')}
                        />
                    </svg>
                </div>
            );
        }

        function ThinkingStatus({ messages }) {
            return (
                <div className="rounded-xl bg-white/3 border border-white/5 p-3">
                    <h4 className="text-white font-medium">AI Thinking</h4>
                    <ul className="mt-2 text-sm text-slate-300 space-y-1">
                        {messages.map((m, i) => (
                            <li key={i} className="flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block" />
                                <span>{m}</span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        function FanZone({ onReact }) {
            const emojis = ['🔥', '👏', '⚡', '❤️'];
            return (
                <div className="rounded-xl bg-white/3 border border-white/5 p-4">
                    <h3 className="text-white font-semibold">Interactive Fan Zone</h3>
                    <p className="text-sm text-slate-300">Cast predictions, react live, earn points</p>

                    <div className="mt-3 flex items-center gap-3">
                        <button className="px-3 py-1 rounded-md bg-gradient-to-r from-indigo-600 to-cyan-600 text-white hover:opacity-90">Predict: Team A wins</button>
                        <button className="px-3 py-1 rounded-md bg-white/5 text-white hover:bg-white/10">Start Poll</button>
                    </div>

                    <div className="mt-4 flex gap-3">
                        {emojis.map((e) => (
                            <button key={e} onClick={() => onReact(e)} className="w-12 h-12 rounded-full bg-white/4 flex items-center justify-center text-xl text-white hover:bg-white/6">{e}</button>
                        ))}
                    </div>
                </div>
            );
        }

        function App() {
            const [energy, setEnergy] = useState(48);
            const [agentsActive, setAgentsActive] = useState(5);
            const [feed, setFeed] = useState([]);
            const [reactions, setReactions] = useState([]);
            const [thinking, setThinking] = useState([]);
            const [momentum, setMomentum] = useState([]);

            const agents = useMemo(() => [
                { id: 'hype', name: 'Hype Agent', subtitle: 'Detects exciting moments', activity: 'Scanning highlights', color: 'purple' },
                { id: 'emotion', name: 'Crowd Emotion', subtitle: 'Mood analysis & emoji', activity: 'Analyzing cheers', color: 'cyan' },
                { id: 'story', name: 'Storyline', subtitle: 'Cinematic narratives', activity: 'Weaving arcs', color: 'amber' },
                { id: 'challenge', name: 'Challenge', subtitle: 'Fan predictions & games', activity: 'Preparing poll', color: 'green' },
                { id: 'community', name: 'Community', subtitle: 'Tribes & engagement', activity: 'Grouping fans', color: 'cyan' },
            ], []);

            const makeId = (prefix = '') => prefix + Math.random().toString(36).slice(2, 9);

            useEffect(() => {
                const ticks = setInterval(() => {
                    setEnergy((e) => {
                        const newE = Math.max(10, Math.min(99, e + (Math.random() - 0.45) * 6));
                        setMomentum((m) => [...m, { t: new Date().toLocaleTimeString().split(':')[2], energy: newE }].slice(-20));
                        return newE;
                    });

                    if (Math.random() > 0.5) {
                        const titles = ['Goal! Spectacular strike 🎯', 'Wicket – close call 🎪', 'Momentum spike 📈', 'Fan chant rises 📢', 'Historic moment 🌟'];
                        const ev = {
                            id: makeId('ev_'),
                            tag: ['G', 'W', 'M', 'F'][Math.floor(Math.random() * 4)],
                            title: titles[Math.floor(Math.random() * titles.length)],
                            time: new Date().toLocaleTimeString(),
                            impact: ['High', 'Medium', 'Low'][Math.floor(Math.random() * 3)],
                        };
                        setFeed((f) => [ev, ...f].slice(0, 50));
                    }

                    if (Math.random() > 0.65) {
                        setThinking([
                            `Analyzing crowd reactions...`,
                            `Generating storyline...`,
                            `Deploying challenge...`,
                        ].slice(0, 3));
                    }

                    setAgentsActive(Math.max(1, Math.round(4 + Math.random() * 3)));
                }, 1200);

                return () => clearInterval(ticks);
            }, []);

            function handleReact(e) {
                const react = { id: makeId('r_'), emoji: e, at: new Date().toLocaleTimeString() };
                setReactions((r) => [react, ...r].slice(0, 20));
                setFeed((f) => [{ id: makeId('ev_'), tag: 'R', title: `Fan reacted ${e}`, time: new Date().toLocaleTimeString(), impact: 'Low' }, ...f].slice(0, 50));
            }

            return (
                <div className="relative">
                    <ParticleBackground />

                    <main className="px-6 py-6 md:px-10 md:py-10 space-y-6 bg-gradient-to-b from-[#05060b] to-[#070814] min-h-screen text-white relative z-10">
                        <Hero energy={energy} agentsActive={agentsActive} />

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 space-y-6">
                                <section>
                                    <h2 className="text-xl font-semibold mb-3">AI Command — Multi-Agent Panel</h2>
                                    <AgentPanel agents={agents} />
                                </section>

                                <section>
                                    <h3 className="text-sm text-slate-300 mb-2">Live Momentum</h3>
                                    <MomentumChart data={momentum} />
                                </section>

                                <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="md:col-span-2">
                                        <h3 className="text-sm text-slate-300 mb-2">Live Event Feed</h3>
                                        <Feed items={feed} />
                                    </div>
                                    <div className="space-y-4">
                                        <EnergyViz energy={energy} />
                                        <ThinkingStatus messages={thinking} />
                                    </div>
                                </section>
                            </div>

                            <aside className="space-y-4">
                                <FanZone onReact={handleReact} />
                                <section className="rounded-xl bg-white/3 border border-white/5 p-4">
                                    <h4 className="text-white font-semibold">Community Feed</h4>
                                    <div className="mt-3 text-sm text-slate-300 space-y-2">
                                        {reactions.slice(0, 6).map(r => (
                                            <div key={r.id} className="flex items-center justify-between animate-slide-in">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-full bg-white/6 flex items-center justify-center text-sm">{r.emoji}</div>
                                                    <div className="text-xs">{r.at}</div>
                                                </div>
                                                <div className="text-xs text-amber-300 font-semibold">+3 pts</div>
                                            </div>
                                        ))}
                                        {reactions.length === 0 && <div className="text-slate-400">No reactions yet — be the first!</div>}
                                    </div>
                                </section>
                            </aside>
                        </div>

                        <footer className="text-center text-sm text-slate-400 mt-6 pt-4 border-t border-white/5">Demo · StadiumOS — Prototype · Simulated data</footer>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
